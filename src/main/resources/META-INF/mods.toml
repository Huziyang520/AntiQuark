modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''AntiQuark is a lightweight compatibility-focused mod that adjusts vanilla behavior conflicts and provides configurable tweaks. Zeta is required. Issues: https://github.com/Huziyang520/AntiQuark/issues Backup: https://issue.mengcai.online/ 反夸克是一个轻量兼容性模组，用于调整原版行为冲突并提供可配置改动，需要安装前置 Zeta。'''
logoFile="antiquark.png"
displayURL="https://github.com/Huziyang520/AntiQuark"
issueTrackerURL="https://github.com/Huziyang520/AntiQuark/issues"

[[dependencies.${mod_id}]]
modId="forge"
mandatory=true
versionRange="${forge_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
mandatory=true
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="zeta"
mandatory=true
versionRange="[1.0,)"
ordering="AFTER"
side="BOTH"
